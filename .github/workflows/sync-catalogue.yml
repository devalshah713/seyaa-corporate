name: Sync catalogue from Google Sheet

# Pulls the master sheet and commits any changes, which triggers a redeploy.
# Adding a row to the sheet is all it takes to publish a product.
#
# Hourly, not daily. Daily meant an edit made during the working day sat
# invisible until the next morning, which reads as the site being broken. The
# commit step exits early when nothing changed, so a quiet run costs one
# 40-second job and no deploy.
#
# THE SCHEDULE IS OFF, DELIBERATELY. Re-enable it by uncommenting the two
# `schedule` lines below — but only once `SHEET_ID` is set, because until then
# this job has nothing to pull and every run is noise.
#
# Why it is off: from 16:04 UTC on 6 Aug every run — scheduled and manually
# dispatched alike — sat queued for fifteen minutes without ever being given a
# runner, and was then cancelled. GitHub reports a cancelled run to the repo
# owner by email as "Run failed", so a platform problem arrived looking like a
# broken build. Nothing in this file causes it and nothing in this file can fix
# it: the job never starts, so `timeout-minutes` never applies either.
#
# It is not worth paging anyone over. This job is a best-effort refresh, and
# the site does not depend on it — `npm run build` runs the same sync, so every
# Vercel deploy pulls the sheet fresh regardless.
on:
  # schedule:
  #   - cron: '7,37 * * * *' # twice an hour, off-peak minutes (UTC)
  workflow_dispatch: # run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-catalogue
  cancel-in-progress: false

env:
  # The branch Vercel deploys. A scheduled run checks out the repository's
  # *default* branch, which is not necessarily this one — and a sync that lands
  # anywhere else never reaches the live site. Naming it explicitly makes the
  # workflow independent of that setting.
  DEPLOY_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    # Downloading a spreadsheet and writing two files takes under a minute. If
    # it is still going after five, something is wedged and waiting longer only
    # holds the queue open for the next run to be cancelled behind it.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No credentials needed — the sheet is shared as "anyone with the link".
      # Which sheet is configuration, set as a repository variable (Settings →
      # Secrets and variables → Actions → Variables) rather than committed, so
      # the source can be repointed without a commit and this public repository
      # carries no link to the price list. Unset, the sync reports that and
      # commits nothing.
      - name: Pull the sheet
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: node scripts/sync-sheet.mjs

      - name: Summarise data health
        if: always()
        run: |
          if [ -f data/data-health.json ]; then
            node -e "
              const h = require('./data/data-health.json');
              const line = (x) => '- **' + x.code + '** — ' + x.message;
              const out = [
                '## Catalogue sync',
                '',
                '| | Count |',
                '|---|---|',
                '| Errors | ' + h.errors.length + ' |',
                '| Warnings | ' + h.warnings.length + ' |',
                '| Notes | ' + h.notes.length + ' |',
                '',
                ...(h.errors.length ? ['### Errors', ...h.errors.map(line), ''] : []),
                ...(h.warnings.length ? ['### Warnings', ...h.warnings.map(line)] : []),
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
            "
          fi

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git add data/
          git commit -m "chore: sync catalogue from Google Sheet"

          # This job checked out main minutes ago and someone may have pushed
          # since. A rejected push is not a reason to lose a good sync, so
          # rebase onto whatever landed and try again.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${DEPLOY_BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected — ${DEPLOY_BRANCH} moved. Rebasing and retrying."
            git fetch origin "${DEPLOY_BRANCH}"
            git rebase "origin/${DEPLOY_BRANCH}" || { git rebase --abort; exit 1; }
          done
          echo "Could not push after 3 attempts."
          exit 1
