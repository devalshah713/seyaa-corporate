name: Sync catalogue from Google Sheet

# Pulls the master sheet and commits any changes, which triggers a redeploy.
# Adding a row to the sheet is all it takes to publish a product.
#
# Hourly, not daily. Daily meant an edit made during the working day sat
# invisible until the next morning, which reads as the site being broken. The
# commit step exits early when nothing changed, so a quiet hour costs one
# 40-second job and no deploy.
on:
  schedule:
    - cron: '0 * * * *' # every hour, on the hour (UTC)
  workflow_dispatch: # lets anyone run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-catalogue
  cancel-in-progress: false

env:
  # The branch Vercel deploys. A scheduled run checks out the repository's
  # *default* branch, which is not necessarily this one — and a sync that lands
  # anywhere else never reaches the live site. Naming it explicitly makes the
  # workflow independent of that setting.
  DEPLOY_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No credentials needed — the sheet is shared as "anyone with the link".
      # Which sheet is configuration, set as a repository variable (Settings →
      # Secrets and variables → Actions → Variables) rather than committed, so
      # the source can be repointed without a commit and this public repository
      # carries no link to the price list. Unset, the sync reports that and
      # commits nothing.
      - name: Pull the sheet
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: node scripts/sync-sheet.mjs

      - name: Summarise data health
        if: always()
        run: |
          if [ -f data/data-health.json ]; then
            node -e "
              const h = require('./data/data-health.json');
              const line = (x) => '- **' + x.code + '** — ' + x.message;
              const out = [
                '## Catalogue sync',
                '',
                '| | Count |',
                '|---|---|',
                '| Errors | ' + h.errors.length + ' |',
                '| Warnings | ' + h.warnings.length + ' |',
                '| Notes | ' + h.notes.length + ' |',
                '',
                ...(h.errors.length ? ['### Errors', ...h.errors.map(line), ''] : []),
                ...(h.warnings.length ? ['### Warnings', ...h.warnings.map(line)] : []),
              ].join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
            "
          fi

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git add data/
          git commit -m "chore: sync catalogue from Google Sheet"
          git push origin "HEAD:${DEPLOY_BRANCH}"
